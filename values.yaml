redis-cart:
  enabled: true
  image:
    # Upstream floats `redis:alpine`; this digest is Redis 8.10.3 (the tag has moved since: docs/findings.md).
    repository: docker.io/library/redis
    tag: alpine
    digest: sha256:21090af93f8324db2f0f0f4f38a7c60369d47d917e000c3423d89d2ae2883537
  # The image's entrypoint runs `redis-server` for arguments that start with `-`. The kubelet expands
  # $(REDIS_PASSWORD) from the container's environment (the `env` entry below).
  args: ["--requirepass", "$(REDIS_PASSWORD)"]
  ports: [{name: redis, containerPort: 6379}]
  env:
    REDIS_PASSWORD:
      valueFrom:
        externalSecretKeyRef: {key: REDIS_PASSWORD}
  externalSecret:
    enabled: true
    secretStoreRef: {kind: ClusterSecretStore, name: boutique}
    data:
      REDIS_PASSWORD: {key: /boutique/redis-password}
    # Read one key at a time (env above), not injected whole.
    envFrom: false
  resources:
    requests: {cpu: 70m, memory: 200Mi}
    limits: {cpu: 125m, memory: 256Mi}
  probes:
    readiness: {periodSeconds: 5, tcpSocket: {port: redis}}
    liveness: {periodSeconds: 5, tcpSocket: {port: redis}}
  # Ephemeral like upstream: a pod restart empties every cart.
  volumes:
    redis-data: {type: emptyDir, mountPath: /data}
  strategy: {type: Recreate}
  networkPolicy:
    enabled: true
    ingress: {fromComponents: [cartservice]}
    egress: {enabled: true}
  commonLabels: *domain-labels

loadgenerator:
  enabled: true
  image:
    repository: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/loadgenerator
    tag: v0.10.7
    digest: sha256:f86f07c0da48bc00e7843e060b6811b56b1ad8a184d3962f5e80e15f42370cc8
  ports: []
  service: {enabled: false}
  config:
    FRONTEND_ADDR: boutique-frontend:80
    USERS: "10"
    RATE: "1"
  resources:
    requests: {cpu: 300m, memory: 256Mi}
    limits: {cpu: 500m, memory: 512Mi}
  initContainers:
    # Upstream's frontend-check, its script verbatim: it waits until the home page answers 200.
    frontend-check:
      image:
        repository: docker.io/library/busybox
        tag: 1.38.0
        digest: sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
      # FRONTEND_ADDR from the component's config: an entry's env takes references only (docs/findings.md G4).
      inheritEnv: true
      resources:
        requests: {cpu: 10m, memory: 16Mi}
        limits: {cpu: 50m, memory: 32Mi}
      command:
        - /bin/sh
        - -exc
        - |
          MAX_RETRIES=12
          RETRY_INTERVAL=10
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $i: Pinging frontend: ${FRONTEND_ADDR}..."
            STATUSCODE=$(wget --server-response http://${FRONTEND_ADDR} 2>&1 | awk '/^  HTTP/{print $2}')
            if [ $STATUSCODE -eq 200 ]; then
                echo "Frontend is reachable."
                exit 0
            fi
            echo "Error: Could not reach frontend - Status code: ${STATUSCODE}"
            sleep $RETRY_INTERVAL
          done
          echo "Failed to reach frontend after $MAX_RETRIES attempts."
          exit 1
  networkPolicy:
    enabled: true
    egress: {enabled: true, toComponents: [frontend]}
  commonLabels: *domain-labels

# Not part of Online Boutique: a post-deploy hook that fails the release unless the home page and a product page answer
# 200 with the product's name (docs/adr/0007-smoke-job-and-redis-password-extensions.md).
smoke:
  enabled: true
  workload: {type: job}
  image:
    repository: registry.k8s.io/e2e-test-images/agnhost
    tag: "2.66.1"
    digest: sha256:6e2eef87d0dc77e070a7549bc5fdfa290c0fefe3359eb33c2ad1eda692fe66a4
  command:
    - /bin/sh
    - -c
    - |
      # fetch <path> <text>: the page must answer 200 and contain <text>. The retries cover the time the CNI takes to
      # program this Job's own NetworkPolicy, a hook created just before it.
      fetch() {
        path="$1" text="$2" i=0
        while :; do
          code="$(curl -sS --max-time 5 -o /tmp/page.html -w '%{http_code}' "http://${FRONTEND_ADDR}${path}")" || code="curl-error"
          if [ "$code" = 200 ] && grep -qF "$text" /tmp/page.html; then
            echo "ok: GET ${path} answered 200 with '${text}'"
            return 0
          fi
          i=$((i + 1))
          if [ "$i" -ge 6 ]; then
            echo "FAIL: GET ${path} answered '${code}', expected 200 with '${text}'; the body begins:" >&2
            head -c 400 /tmp/page.html >&2 || true
            return 1
          fi
          sleep 5
        done
      }
      fetch / "<div class=\"hot-product-card-name\">${SMOKE_PRODUCT_NAME}</div>" &&
        fetch "/product/${SMOKE_PRODUCT_ID}" "<h2>${SMOKE_PRODUCT_NAME}</h2>" &&
        echo smoke-ok
  ports: []
  config:
    FRONTEND_ADDR: boutique-frontend:80
    # A product of the catalog (src/productcatalogservice/products.json at v0.10.7).
    SMOKE_PRODUCT_ID: OLJCESPC7Z
    SMOKE_PRODUCT_NAME: Sunglasses
  resources:
    requests: {cpu: 10m, memory: 16Mi}
    limits: {cpu: 100m, memory: 64Mi}
  # Two pages, six tries each, at most 10 s a try: 120 s, within the deadline.
  job: {phase: post-deploy, backoffLimit: 0, activeDeadlineSeconds: 180}
  networkPolicy:
    enabled: true
    egress: {enabled: true, toComponents: [frontend]}
  commonLabels: *domain-labels
