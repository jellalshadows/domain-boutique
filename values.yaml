  config: {PORT: "9555"}
  resources:
    requests: {cpu: 200m, memory: 180Mi}
    limits: {cpu: 300m, memory: 300Mi}
  probes:
    readiness: {initialDelaySeconds: 20, periodSeconds: 15, grpc: {port: 9555}}
    liveness: {initialDelaySeconds: 20, periodSeconds: 15, grpc: {port: 9555}}
