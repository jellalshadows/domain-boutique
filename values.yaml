  enabled: true
  image:
    repository: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/paymentservice
    tag: v0.10.7
    digest: sha256:e1ff27c553f7e0c31f4a10f1950ec0ee34cd41d77dd819b1fcfa139273891602
  ports: [{name: grpc, containerPort: 50051}]
