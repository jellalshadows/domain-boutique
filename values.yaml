# Online Boutique v0.10.7 (GoogleCloudPlatform/microservices-demo, commit 5b608cb) as a domain umbrella of chart-base.
#
# The consumption model: each component's whole configuration sits under its alias, and chart-base's schema checks
# it. Components are turned on and off with `<alias>.enabled`, a real boolean (never `"false"`); nothing is configured
# through `global`, which Helm injects and chart-base never reads. The root values.schema.json rejects a mistyped alias
# and a non-boolean `enabled`.
#
# The release name is part of these values. chart-base names every object `<release>-<alias>`, so a component reaches
# a sibling at `boutique-<alias>:<service port>`. helmfile.yaml pins the release name `boutique` (and the namespace
# `boutique`); rendering under another release name succeeds and breaks every call between components at runtime
# (docs/adr/0003-release-name-pinned-by-helmfile.md, docs/findings.md G1).
#
# Images are pinned by digest (resolved 2026-11-03; a tag can be re-pushed, a digest cannot). The tag stays for the
# chart's version label. The Online Boutique images are linux/amd64 only.

frontend:
  enabled: true
  image:
    repository: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/frontend
    tag: v0.10.7
    digest: sha256:e1cbd4561d3c9d27497dc0e8b1c12da194c4bf2ea82648f58bf38f073698f483
  ports:
    - name: http
      containerPort: 8080
      servicePort: 80
  config:
    PORT: "8080"
    PRODUCT_CATALOG_SERVICE_ADDR: boutique-productcatalogservice:3550
    CURRENCY_SERVICE_ADDR: boutique-currencyservice:7000
    CART_SERVICE_ADDR: boutique-cartservice:7070
    RECOMMENDATION_SERVICE_ADDR: boutique-recommendationservice:8080
    SHIPPING_SERVICE_ADDR: boutique-shippingservice:50051
    CHECKOUT_SERVICE_ADDR: boutique-checkoutservice:5050
    AD_SERVICE_ADDR: boutique-adservice:9555
    # Not deployed: the frontend panics at start when any of its eight addresses is empty (src/frontend/main.go:139).
    SHOPPING_ASSISTANT_SERVICE_ADDR: boutique-shoppingassistantservice:80
    ENABLE_PROFILER: "0"
  resources:
    requests: {cpu: 100m, memory: 64Mi}
    limits: {cpu: 200m, memory: 128Mi}
  probes:
    readiness:
      initialDelaySeconds: 10
      httpGet:
        path: /_healthz
        port: http
        httpHeaders: [{name: Cookie, value: shop_session-id=x-readiness-probe}]
    liveness:
      initialDelaySeconds: 10
      httpGet:
        path: /_healthz
        port: http
        httpHeaders: [{name: Cookie, value: shop_session-id=x-liveness-probe}]
  # Rendered, not served: no Gateway controller is installed (docs/adr/0005-frontend-exposed-by-service-and-httproute.md).
  httpRoute:
    enabled: true
    parentRefs: [{name: boutique-gw, namespace: gateway, sectionName: http}]
    hostnames: [boutique.example.test]
  networkPolicy:
    enabled: true
    ingress:
      fromComponents: [loadgenerator, smoke]
      # The Gateway's proxy pods (Envoy Gateway's default mode runs them in its own namespace).
      fromNamespaces: [envoy-gateway-system]
    egress:
      enabled: true
      toComponents:
        - productcatalogservice
        - currencyservice
        - cartservice
        - recommendationservice
        - shippingservice
        - checkoutservice
        - adservice
  # Shared by every component through a YAML anchor: the other aliases write `commonLabels: *domain-labels`
  # (docs/adr/0002-values-under-each-alias.md: measured under helm lint --strict with the root schema).
  commonLabels: &domain-labels {domain: boutique}

productcatalogservice:
  enabled: true
  image:
    repository: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/productcatalogservice
    tag: v0.10.7
    digest: sha256:ba573405e9b03ea29970185eeaf0a9de9db7400b9104695e39d4dfc0fb651cb5
  ports: [{name: grpc, containerPort: 3550}]
  config: {PORT: "3550", DISABLE_PROFILER: "1"}
  resources:
    requests: {cpu: 100m, memory: 64Mi}
    limits: {cpu: 200m, memory: 128Mi}
  # A gRPC probe takes a port number only (docs/findings.md G2).
  probes:
    readiness: {grpc: {port: 3550}}
    liveness: {grpc: {port: 3550}}
  networkPolicy:
    enabled: true
    ingress: {fromComponents: [frontend, checkoutservice, recommendationservice]}
    egress: {enabled: true}
  commonLabels: *domain-labels

currencyservice:
  enabled: true
  image:
    repository: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/currencyservice
    tag: v0.10.7
    digest: sha256:c581681bbf9abec8563e520aac3f3dbe3e7498853b6eb263193bc80c87e42f74
  ports: [{name: grpc, containerPort: 7000}]
  config: {PORT: "7000", DISABLE_PROFILER: "1"}
  resources:
    requests: {cpu: 100m, memory: 64Mi}
    limits: {cpu: 200m, memory: 128Mi}
  probes:
    readiness: {grpc: {port: 7000}}
    liveness: {grpc: {port: 7000}}
  networkPolicy:
    enabled: true
    ingress: {fromComponents: [frontend, checkoutservice]}
    egress: {enabled: true}
  commonLabels: *domain-labels

cartservice:
  enabled: true
  image:
    repository: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/cartservice
    tag: v0.10.7
    digest: sha256:e5310c2aa45732e351c55c88051700d958dc7ed2693e66405fc6c70cf080109e
  ports: [{name: grpc, containerPort: 7070}]
  # REDIS_ADDR comes from the component's own ExternalSecret: the cart service hands it to StackExchange.Redis as a
  # configuration string, so it carries the password (docs/adr/0007-smoke-job-and-redis-password-extensions.md).
  externalSecret:
    enabled: true
    secretStoreRef: {kind: ClusterSecretStore, name: boutique}
    data:
      REDIS_PASSWORD: {key: /boutique/redis-password}
    template:
      mergePolicy: Replace
      data:
        REDIS_ADDR: "boutique-redis-cart:6379,password={{ .REDIS_PASSWORD }}"
  resources:
    requests: {cpu: 200m, memory: 64Mi}
    limits: {cpu: 300m, memory: 128Mi}
  probes:
    readiness: {initialDelaySeconds: 15, grpc: {port: 7070}}
    liveness: {initialDelaySeconds: 15, periodSeconds: 10, grpc: {port: 7070}}
  networkPolicy:
    enabled: true
    ingress: {fromComponents: [frontend, checkoutservice]}
    egress: {enabled: true, toComponents: [redis-cart]}
  commonLabels: *domain-labels

recommendationservice:
  enabled: true
  image:
    repository: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/recommendationservice
    tag: v0.10.7
